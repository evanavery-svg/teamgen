<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- page -->
<title>Team Picker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
  :root {
    --bg: #f6f6f4;
    --surface: #ffffff;
    --ink: #1a1a1a;
    --muted: #767672;
    --line: #e4e4e0;
    --hover: #f0f0ed;
    --primary: #1a1a1a;
    --primary-ink: #ffffff;
    --error: #c0392b;
    --t1: #2f9e62; --t2: #3b73d9; --t3: #e0762f; --t4: #9054c9;
    --t5: #d6455f; --t6: #1e9aa6; --t7: #c49a1a; --t8: #6b7682;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #131313; --surface: #1c1c1c; --ink: #ededeb; --muted: #95958f;
      --line: #2c2c2a; --hover: #252523; --primary: #ededeb; --primary-ink: #131313; --error: #f08a7e;
      --t1: #52c285; --t2: #7aa4f0; --t3: #f0995a; --t4: #b98ae6;
      --t5: #f07a90; --t6: #4ec3cd; --t7: #dcbb4f; --t8: #a0aab4;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #131313; --surface: #1c1c1c; --ink: #ededeb; --muted: #95958f;
    --line: #2c2c2a; --hover: #252523; --primary: #ededeb; --primary-ink: #131313; --error: #f08a7e;
    --t1: #52c285; --t2: #7aa4f0; --t3: #f0995a; --t4: #b98ae6;
    --t5: #f07a90; --t6: #4ec3cd; --t7: #dcbb4f; --t8: #a0aab4;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.5 "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 48px 16px 32px;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 560px; margin: 0 auto; display: grid; gap: 32px; }

  h1 { font-size: 1.75rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; margin: 0; }
  .lede { margin: 6px 0 0; color: var(--muted); }

  /* Input card */
  form { display: grid; gap: 12px; }
  .sr-label, .sr-only {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  textarea {
    width: 100%;
    min-height: 200px;
    resize: vertical;
    font: inherit;
    line-height: 1.6;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 16px;
    transition: border-color .15s, box-shadow .15s;
  }
  textarea::placeholder { color: var(--muted); }
  textarea:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 3px var(--hover); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .hint-row { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; padding: 0 4px; }
  .hint { font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  kbd {
    font-family: inherit; font-size: 0.75rem; font-weight: 500; line-height: 1;
    border: 1px solid var(--line); border-radius: 5px;
    padding: 2px 5px; background: var(--surface); color: var(--ink);
  }
  @media (hover: none) { .hint-row .hint + .hint { display: none; } }

  .controls { display: flex; gap: 10px; align-items: stretch; }

  .stepper {
    display: flex; align-items: center;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px;
  }
  .stepper button {
    width: 36px; height: 36px; padding: 0;
    border: 0; border-radius: 50%;
    background: transparent;
    font-size: 1.15rem; line-height: 1;
  }
  .stepper button:hover { background: var(--hover); }
  .stepper input {
    width: 3.2em; border: 0; background: transparent; color: var(--ink);
    font-family: inherit; font-size: 1.05rem; font-weight: 600; line-height: 1;
    text-align: center; font-variant-numeric: tabular-nums;
    -moz-appearance: textfield;
  }
  .stepper input::-webkit-inner-spin-button, .stepper input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .stepper-label { align-self: center; color: var(--muted); font-size: 0.9rem; padding-right: 4px; white-space: nowrap; }

  button {
    font: inherit;
    font-weight: 600;
    color: var(--ink);
    cursor: pointer;
    transition: background-color .15s, color .15s, border-color .15s, transform .12s, opacity .15s;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  button:active { transform: scale(0.96); }
  button:disabled { opacity: .4; cursor: default; transform: none; }

  .primary {
    flex: 1;
    border: 0;
    border-radius: 999px;
    background: var(--primary);
    color: var(--primary-ink);
    padding: 12px 20px;
    font-size: 1rem;
  }
  .primary:hover { opacity: .88; }

  .error { color: var(--error); margin: 0; padding: 0 4px; font-size: 0.9rem; }
  .error-wrap { display: grid; grid-template-rows: 0fr; opacity: 0; transition: grid-template-rows .3s cubic-bezier(.2,.8,.2,1), opacity .2s ease; }
  .error-wrap > p { overflow: hidden; min-height: 0; }
  .error-wrap.show { grid-template-rows: 1fr; opacity: 1; }
  .shake { animation: shake .4s cubic-bezier(.36,.07,.19,.97); }
  .pop { animation: pop .25s ease-out; }

  /* Results */
  #results { display: grid; gap: 14px; transition: opacity .2s; }
  #results.stale { opacity: .35; }
  #results.stale .teams { pointer-events: none; }

  .results-head { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; padding: 0 4px; }
  .results-head h2 { font-size: 1rem; font-weight: 600; margin: 0; display: inline; }
  .summary { display: inline; color: var(--muted); font-size: 0.9rem; font-variant-numeric: tabular-nums; margin: 0 0 0 8px; }
  .actions { display: flex; gap: 2px; margin-right: -8px; }
  .icon-btn {
    display: inline-flex; align-items: center; gap: 6px;
    border: 0; background: transparent; border-radius: 999px;
    padding: 7px 10px; font-size: 0.9rem; color: var(--muted);
  }
  .icon-btn:hover { background: var(--hover); color: var(--ink); }
  .icon-btn svg { width: 15px; height: 15px; flex: none; }
  .icon-btn.spin svg { animation: spin .5s cubic-bezier(.3,.7,.3,1); }
  #copy span { display: inline-block; min-width: 5.6em; text-align: left; }
  #copy.copied { color: var(--t1); }

  .teams {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 10px;
    align-items: start;
  }
  .team {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 16px 16px;
    transition: transform .2s ease, box-shadow .2s ease;
  }
  @media (hover: hover) {
    .team:hover { transform: translateY(-2px); box-shadow: 0 8px 20px -14px rgba(0,0,0,.35); }
  }
  .team h3 {
    display: flex; align-items: center; gap: 8px;
    margin: 0 0 8px;
    font-size: 0.95rem; font-weight: 600;
    white-space: nowrap;
  }
  .team h3::before {
    content: ""; width: 9px; height: 9px; border-radius: 50%;
    background: var(--c); flex: none;
  }
  .team h3 span {
    margin-left: auto;
    font-size: 0.8rem; font-weight: 400; color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .team ol { margin: 0; padding-left: 1.5em; display: grid; gap: 2px; }
  .team li { overflow-wrap: anywhere; border-radius: 6px; padding: 1px 6px; margin-left: -6px; }
  .team li::marker { color: var(--muted); font-size: 0.85em; font-variant-numeric: tabular-nums; }

  .site-footer {
    display: flex; flex-wrap: wrap; gap: 4px 8px; justify-content: center;
    font-size: 0.8rem; color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  /* Deal animation: cards rise in, then names land one by one in deal order */
  .teams.animate .team { animation: card-in .4s cubic-bezier(.2,.8,.2,1) both; animation-delay: var(--cd, 0ms); }
  .teams.animate li {
    animation: name-in .42s cubic-bezier(.2,.9,.3,1.2) both, flash .9s ease-out both;
    animation-delay: var(--d, 0ms), var(--d, 0ms);
  }
  .teams.animate .team h3 span { animation: fade-in .3s ease both; animation-delay: var(--sd, 0ms); }
  .team li.moved { animation: flash 1.1s ease-out both; animation-delay: var(--d, 0ms); }

  @keyframes card-in { from { opacity: 0; transform: translateY(14px) scale(.96); } to { opacity: 1; transform: none; } }
  @keyframes name-in { from { opacity: 0; transform: translateY(-12px) scale(.9); } to { opacity: 1; transform: none; } }
  @keyframes flash {
    from { background-color: color-mix(in srgb, var(--c) 22%, transparent); }
    to { background-color: transparent; }
  }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pop { 40% { transform: scale(1.12); } }
  @keyframes shake {
    20% { transform: translateX(-6px); } 40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); } 80% { transform: translateX(3px); }
  }

  @media (max-width: 440px) {
    body { padding-top: 32px; }
    .team { padding: 12px 12px 14px; }
    .team h3 { gap: 6px; }
    .team h3 span { font-size: 0.75rem; }
    .stepper-label { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-delay: 0ms !important;
      transition-duration: .01ms !important;
    }
  }
</style>
<!-- /page -->
</head>
<body>
<!-- page -->
<div class="wrap">
  <header>
    <h1>Team Picker</h1>
    <p class="lede">Add names, choose how many teams, and go.</p>
  </header>

  <form id="form" novalidate>
    <label for="names" class="sr-label">Names</label>
    <textarea id="names" spellcheck="false" placeholder="One name per line (commas work too)"></textarea>
    <div class="hint-row">
      <span class="hint" id="count" aria-live="polite">0 names</span>
      <span class="hint"><kbd>Ctrl</kbd> + <kbd>Enter</kbd> to make teams</span>
    </div>

    <div class="controls">
      <div class="stepper">
        <button type="button" id="minus" aria-label="Fewer teams">−</button>
        <input type="number" id="teams" min="1" value="2" inputmode="numeric" aria-label="Number of teams">
        <button type="button" id="plus" aria-label="More teams">+</button>
        <span class="stepper-label" aria-hidden="true">teams</span>
      </div>
      <button type="submit" class="primary">Make teams</button>
    </div>
    <div class="error-wrap" id="errorWrap"><p class="error" id="error" role="alert"></p></div>
  </form>

  <section id="results" hidden>
    <div class="results-head">
      <div>
        <h2>Teams</h2>
        <p class="summary" id="summary"></p>
      </div>
      <div class="actions">
        <button type="button" id="shuffle" class="icon-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 21v-5h5"/></svg><span>Shuffle</span></button>
        <button type="button" id="copy" class="icon-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg><span>Copy</span></button>
      </div>
    </div>
    <div class="teams" id="teamList"></div>
    <p class="sr-only" id="status" aria-live="polite"></p>
  </section>

  <footer class="site-footer">
    <span>© 2026 Avery</span>
    <span aria-hidden="true">·</span>
    <span>v1.4</span>
  </footer>
</div>

<script>
(function () {
  function $(id) { return document.getElementById(id); }
  var namesEl = $('names');
  var teamsEl = $('teams');
  var countEl = $('count');
  var errorEl = $('error');
  var errorWrap = $('errorWrap');
  var resultsEl = $('results');
  var listEl = $('teamList');
  var summaryEl = $('summary');
  var statusEl = $('status');
  var shuffleBtn = $('shuffle');
  var copyBtn = $('copy');
  var copyLabel = copyBtn.querySelector('span');
  var COLORS = 8;
  var lastTeams = [];
  var animTimer = 0, copyTimer = 0, saveTimer = 0;
  var reduceMotion = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;

  var SAMPLE = 'Alex\nJordan\nSam\nTaylor\nRiley\nMorgan\nCasey\nJamie\nQuinn\nAvery';

  function motionOK() { return !(reduceMotion && reduceMotion.matches); }
  function load(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
  function save(key, val) { try { localStorage.setItem(key, val); } catch (e) {} }
  function plural(n, word) { return n + ' ' + word + (n === 1 ? '' : 's'); }

  // Restart a one-shot CSS animation class on an element.
  function replay(el, cls) {
    el.classList.remove(cls);
    void el.offsetWidth;
    el.classList.add(cls);
    el.addEventListener('animationend', function () { el.classList.remove(cls); }, { once: true });
  }

  function parseNames() {
    return namesEl.value
      .split(/[\n,]+/)
      .map(function (s) { return s.trim(); })
      .filter(Boolean);
  }

  function updateCount() {
    var names = parseNames();
    var seen = {}, repeats = 0;
    names.forEach(function (n) {
      var key = n.toLowerCase();
      if (seen[key]) repeats++; else seen[key] = true;
    });
    countEl.textContent = plural(names.length, 'name') + (repeats ? ' · ' + repeats + ' repeated' : '');
    teamsEl.max = Math.max(1, names.length);
  }

  // Unbiased random integer in [0, max) using rejection sampling.
  function randInt(max) {
    if (window.crypto && crypto.getRandomValues) {
      var buf = new Uint32Array(1);
      var limit = 4294967296 - (4294967296 % max);
      do { crypto.getRandomValues(buf); } while (buf[0] >= limit);
      return buf[0] % max;
    }
    return Math.floor(Math.random() * max);
  }

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = randInt(i + 1);
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  // Deal shuffled names round-robin so team sizes differ by at most one,
  // then shuffle team order so the bigger teams aren't always first.
  function makeTeams(names, count) {
    var teams = [];
    for (var i = 0; i < count; i++) teams.push([]);
    shuffle(names).forEach(function (name, i) { teams[i % count].push(name); });
    return shuffle(teams);
  }

  function showError(msg) {
    if (msg) errorEl.textContent = msg;
    errorWrap.classList.toggle('show', !!msg);
    resultsEl.classList.toggle('stale', !!msg);
    copyBtn.disabled = !!msg;
    if (msg) replay(errorEl, 'shake');
  }

  function render(teams, animate) {
    clearTimeout(animTimer);
    listEl.classList.remove('animate');

    var frag = document.createDocumentFragment();
    var lists = [], sizes = [];
    var total = 0, longest = 0;

    teams.forEach(function (members, i) {
      var card = document.createElement('div');
      card.className = 'team';
      card.dataset.i = i;
      card.style.setProperty('--c', 'var(--t' + ((i % COLORS) + 1) + ')');
      var h = document.createElement('h3');
      h.textContent = 'Team ' + (i + 1);
      var size = document.createElement('span');
      size.textContent = plural(members.length, 'player');
      h.appendChild(size);
      var ol = document.createElement('ol');
      members.forEach(function (m) {
        var li = document.createElement('li');
        li.textContent = m;
        ol.appendChild(li);
      });
      card.appendChild(h);
      card.appendChild(ol);
      frag.appendChild(card);
      lists.push(ol.children);
      sizes.push(size);
      total += members.length;
      longest = Math.max(longest, members.length);
      if (animate) card.style.setProperty('--cd', Math.round(i * Math.min(60, 360 / teams.length)) + 'ms');
    });

    if (animate) {
      // Names land in the same order a dealer would hand them out:
      // one to each team, round after round.
      var step = Math.min(70, 1100 / total);
      var base = 180, order = 0, end = base;
      for (var row = 0; row < longest; row++) {
        for (var t = 0; t < lists.length; t++) {
          var li = lists[t][row];
          if (!li) continue;
          var d = Math.round(base + order++ * step);
          li.style.setProperty('--d', d + 'ms');
          sizes[t].style.setProperty('--sd', d + 'ms');
          end = d;
        }
      }
    }

    listEl.textContent = '';
    listEl.appendChild(frag);
    resultsEl.hidden = false;

    if (animate) {
      void listEl.offsetWidth;
      listEl.classList.add('animate');
      // Drop the animation class once finished so hover effects work normally.
      animTimer = setTimeout(function () { listEl.classList.remove('animate'); }, end + 1000);
    }
  }

  var EASE = 'cubic-bezier(.22,.8,.24,1)';

  // Count repeats so duplicate names each get their own identity.
  function keyer() {
    var seen = {};
    return function (name) { seen[name] = (seen[name] || 0) + 1; return name + '\u0000' + seen[name]; };
  }

  // Remember where every card and name currently sits on screen.
  function snapshot() {
    var key = keyer(), names = {}, cards = [];
    var dealing = listEl.classList.contains('animate');
    Array.prototype.forEach.call(listEl.children, function (card) {
      cards.push(card.getBoundingClientRect().height);
      Array.prototype.forEach.call(card.querySelectorAll('li'), function (li) {
        var k = key(li.textContent);
        if (dealing && parseFloat(getComputedStyle(li).opacity) < 0.5) return;
        names[k] = { rect: li.getBoundingClientRect(), team: card.dataset.i };
      });
    });
    return { names: names, cards: cards };
  }

  // FLIP: after re-rendering, start each name at its old position and let it
  // slide to the new one. Cards ease to their new height.
  function glide(prev) {
    var key = keyer(), moves = [], cardMoves = [], order = 0;
    // Measure everything first, before any animation shifts the layout.
    Array.prototype.forEach.call(listEl.children, function (card, ci) {
      cardMoves.push({ el: card, from: prev.cards[ci], to: card.getBoundingClientRect().height, ci: ci });
      Array.prototype.forEach.call(card.querySelectorAll('li'), function (li) {
        var old = prev.names[key(li.textContent)];
        moves.push({ el: li, old: old, rect: li.getBoundingClientRect(), switched: old && old.team !== card.dataset.i });
      });
    });
    var newCards = 0;
    cardMoves.forEach(function (m) {
      if (m.from == null) {
        m.el.animate(
          [{ opacity: 0, transform: 'translateY(14px) scale(.96)' }, { opacity: 1, transform: 'none' }],
          { duration: 420, easing: EASE, delay: 60 * newCards++, fill: 'backwards' });
      } else if (Math.abs(m.from - m.to) > 1) {
        m.el.animate([{ height: m.from + 'px' }, { height: m.to + 'px' }], { duration: 520, easing: EASE });
      }
    });
    var stagger = Math.min(18, 360 / Math.max(1, moves.length));
    moves.forEach(function (m) {
      var delay = Math.round(order++ * stagger);
      if (!m.old) {
        m.el.animate(
          [{ opacity: 0, transform: 'translateY(-10px) scale(.9)' }, { opacity: 1, transform: 'none' }],
          { duration: 420, easing: EASE, delay: 200 + delay, fill: 'backwards' });
        return;
      }
      var dx = m.old.rect.left - m.rect.left, dy = m.old.rect.top - m.rect.top;
      if (Math.abs(dx) > 0.5 || Math.abs(dy) > 0.5) {
        m.el.animate(
          [{ transform: 'translate(' + dx + 'px,' + dy + 'px)' }, { transform: 'none' }],
          { duration: 700, easing: EASE, delay: delay, fill: 'backwards' });
      }
      if (m.switched) {
        m.el.style.setProperty('--d', (delay + 380) + 'ms');
        m.el.classList.add('moved');
      }
    });
  }

  function generate(opts) {
    opts = opts || {};
    var names = parseNames();
    var count = parseInt(teamsEl.value, 10);
    if (names.length === 0) return showError('Add at least one name.');
    if (!count || count < 1) return showError('Number of teams must be 1 or more.');
    if (count > names.length) {
      return showError('You have ' + plural(names.length, 'name') + ' but asked for ' + count +
        ' teams. Lower the team count or add more names.');
    }
    showError('');
    teamsEl.value = count;
    save('teamgen.names', namesEl.value);
    save('teamgen.teams', String(count));
    lastTeams = makeTeams(names, count);
    summaryEl.textContent = plural(names.length, 'name') + ' · ' + plural(count, 'team');
    statusEl.textContent = 'Made ' + plural(count, 'team') + ': ' + teamsAsText().replace(/\n/g, '. ');

    var animate = opts.animate && motionOK();
    if (animate && !resultsEl.hidden && listEl.children.length) {
      // Teams already on screen: glide every name to its new spot.
      var prev = snapshot();
      render(lastTeams, false);
      glide(prev);
    } else {
      // First time: deal the names out one by one.
      render(lastTeams, animate);
    }

    if (opts.scroll) {
      requestAnimationFrame(function () {
        if (resultsEl.getBoundingClientRect().top > window.innerHeight * 0.7) {
          resultsEl.scrollIntoView({ behavior: motionOK() ? 'smooth' : 'auto', block: 'start' });
        }
      });
    }
  }

  function teamsAsText() {
    return lastTeams.map(function (members, i) {
      return 'Team ' + (i + 1) + ': ' + members.join(', ');
    }).join('\n');
  }

  function step(delta) {
    var max = Math.max(1, parseNames().length);
    var v = parseInt(teamsEl.value, 10) || 1;
    var next = Math.min(Math.max(1, v + delta), max);
    if (next !== v) {
      teamsEl.value = next;
      replay(teamsEl, 'pop');
    }
  }

  $('form').addEventListener('submit', function (e) {
    e.preventDefault();
    generate({ animate: true, scroll: true });
  });
  shuffleBtn.addEventListener('click', function () {
    replay(shuffleBtn, 'spin');
    generate({ animate: true });
  });
  $('minus').addEventListener('click', function () { step(-1); });
  $('plus').addEventListener('click', function () { step(1); });
  teamsEl.addEventListener('change', function () {
    var v = parseInt(teamsEl.value, 10);
    if (v >= 1) teamsEl.value = v;
  });

  namesEl.addEventListener('input', function () {
    updateCount();
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () { save('teamgen.names', namesEl.value); }, 400);
  });
  namesEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      generate({ animate: true, scroll: true });
    }
  });

  copyBtn.addEventListener('click', function () {
    if (!lastTeams.length) return;
    var text = teamsAsText();
    function done(ok) {
      clearTimeout(copyTimer);
      copyLabel.textContent = ok ? 'Copied' : 'Failed';
      copyBtn.classList.toggle('copied', ok);
      if (ok) replay(copyBtn, 'pop');
      copyTimer = setTimeout(function () {
        copyLabel.textContent = 'Copy';
        copyBtn.classList.remove('copied');
      }, 1600);
    }
    function fallback() {
      var tmp = document.createElement('textarea');
      tmp.value = text;
      tmp.setAttribute('readonly', '');
      tmp.style.position = 'fixed';
      tmp.style.opacity = '0';
      document.body.appendChild(tmp);
      tmp.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(tmp);
      copyBtn.focus();
      done(ok);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { done(true); }, fallback);
    } else {
      fallback();
    }
  });

  var storedNames = load('teamgen.names');
  namesEl.value = storedNames && storedNames.trim() ? storedNames : SAMPLE;
  if (/Mac|iPhone|iPad/.test(navigator.platform || '')) document.querySelector('.hint-row kbd').textContent = '⌘';
  updateCount();
  teamsEl.value = Math.min(Math.max(1, parseInt(load('teamgen.teams'), 10) || 2), Math.max(1, parseNames().length));
  generate();
})();
</script>
<!-- /page -->
</body>
</html>
